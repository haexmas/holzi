name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  documentation:
    name: Documentation consistency
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check patch whitespace
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.sha }}"

      - name: Validate documentation
        run: python3 scripts/ci/check-docs.py

  rust:
    name: Rust checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Run tests with default features
        run: cargo test --manifest-path src-tauri/Cargo.toml --jobs 2

      - name: Run tests without default features
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --jobs 2

      - name: Run Clippy with default features
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --jobs 2 -- -D warnings

      - name: Run Clippy without default features
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --no-default-features --all-targets --jobs 2 -- -D warnings
