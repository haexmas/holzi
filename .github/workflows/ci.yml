name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  documentation:
    name: Documentation consistency
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check patch whitespace
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.sha }}"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.19.0

      - name: Install frontend dependencies
        run: corepack pnpm install --frozen-lockfile --ignore-scripts

      - name: Check chat state
        run: corepack pnpm check:chat-state

      - name: Typecheck frontend
        run: corepack pnpm typecheck

      - name: Lint frontend
        run: corepack pnpm lint

      - name: Validate documentation
        run: python3 scripts/ci/check-docs.py
  rust:
    name: Rust checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet "${{ github.event.pull_request.base.sha }}...${{ github.sha }}" -- 'src-tauri/**/*.rs'; then
            echo "No Rust files changed; formatting check skipped."
          else
            cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          fi

      - name: Run tests with default features
        run: cargo test --manifest-path src-tauri/Cargo.toml --jobs 2

      - name: Run tests without default features
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --jobs 2

      - name: Run Clippy with default features
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --jobs 2 -- -D warnings

      - name: Run Clippy without default features
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --no-default-features --all-targets --jobs 2 -- -D warnings

  local-cli-e2e:
    name: Vault → model → CLI E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Run vault → loaded model session → CLI acceptance test
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml \
            --test chat_tool_loop \
            ci_e2e_loaded_model_can_request_and_process_a_cli_command \
            -- --nocapture
