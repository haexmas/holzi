[package]
name = "holzi"
version = "0.1.0"
description = "Portable personal-agent Tauri app with embedded encrypted store"
authors = ["haexmas"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/haexmas/holzi"
edition = "2021"
rust-version = "1.95"

[lib]
name = "holzi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.3.0", features = [] }

[features]
# Default enables local inference on CPU and voice control so a fresh
# `cargo build` yields a working Chat pipeline plus mic dictation out of the
# box. Set `--no-default-features` to skip mistralrs/candle and cpal entirely
# while iterating on unrelated code.
default = ["llm-cpu", "voice"]

# Local inference via mistralrs 0.8.x (in-process, per plan §"Lokale Inferenz").
# Also gates the local Whisper STT adapter (spec 008): it shares the same
# candle-core/candle-nn runtime mistralrs already pulls in, via
# candle-transformers, so it is pinned to llm-cpu rather than its own
# feature. A `voice`-only build (no llm-cpu) keeps the STT trait, audio
# capture, and interrupt matcher compilable but has no local transcription
# backend at runtime (`SttError::LocalSttUnavailable`).
llm-cpu = [
    "dep:mistralrs",
    "dep:candle",
    "dep:candle-nn",
    "dep:candle-transformers",
    "dep:tokenizers",
]
# CUDA build. Needs nvcc + CUDA toolkit >= 12.0 present at build time
# (Etappe 0 finding #3). Not enabled by default; opt in via
# `cargo build --features llm-cuda`.
llm-cuda = ["llm-cpu", "mistralrs/cuda"]
# Metal build (Apple GPU). Same relationship to `llm-cpu` as CUDA.
llm-metal = ["llm-cpu", "mistralrs/metal"]

# Voice control (spec 008): mic capture (cpal) + the STT pipeline scaffolding
# (audio module, interrupt matcher, voice Tauri commands). Independent of
# llm-cpu — see the llm-cpu comment above for what running without it means.
voice = ["dep:cpal"]

[dependencies]
tauri = { version = "2.6.2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2.5.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
log = "0.4"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
ts-rs = { version = "12", features = ["serde-compat", "uuid-impl"] }
filetime = "0.2"
# File-integrity hashing (models.file_sha256, spec 005 Entscheidung 6).
# Already present as a transitive dependency (rustls/haex-crdt); pinned
# directly here because the model-integrity boundary calls it explicitly.
sha2 = "0.11"
unicode-segmentation = "1.13"

# haex-crdt 0.4.0, originally pinned per plans/001-desktop-mvp.md at commit
# 1c069ef; bumped to main's current HEAD (no tagged releases past v0.1.0
# exist yet). `raw-connection` gives holzi's storage wrapper direct
# rusqlite access for the `haex_hlc_no_sync = current_hlc()` write
# convention (Etappe 0 finding).
haex-crdt = { git = "https://github.com/haexmas/haex-crdt", rev = "b8c9c6cd9cea0fc5bcfe3700f968781d5e4d81da", features = ["raw-connection"] }

# Local inference runtime chosen in plans/001-desktop-mvp.md §"Lokale Inferenz".
# Pinned to 0.8.1 per Etappe 0 finding #1 (0.6 line does not exist on
# crates.io; API moved between 0.6 expectation and 0.8.1). Kept optional so
# `--no-default-features` builds skip the candle/nvcc dependency graph.
mistralrs = { version = "0.8.1", optional = true }
# Tokio is unconditional: reqwest and the download commands need an async
# runtime even without local inference, and Tauri already pulls tokio in
# transitively. The extra `sync` and `fs` features are cheap. `net` is for
# the cli_delegate approval-bridge IPC hop (Unix domain socket / Windows
# named pipe, spec 007-cli-delegate data-model.md) — no separate crate.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "fs", "net", "io-std"] }
futures = "0.3"
# `CancellationToken` for cooperative cancellation of an in-flight tool
# execution or a pending approval wait (spec.md FR-009/FR-010) — already a
# real (non-transitive) dependency of `rmcp`, see its `service.rs`.
tokio-util = "0.7"

# Slice b: hardware detection and model catalog / download.
# `sysinfo` and `reqwest` are unconditional — hardware info and provider
# list are surfaced even in `--no-default-features` builds.
sysinfo = "0.39"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "json", "query"] }

# `async-trait` lets provider adapters expose `async fn` in a `dyn`-safe
# trait. The chat dispatch needs `Arc<dyn ProviderAdapter>` to swap
# between local and api_key adapters at runtime; a native `async fn` in
# trait would not satisfy dyn-compatibility.
async-trait = "0.1"

# SSE frame reassembly for adapters that stream tokens over
# `text/event-stream` (Anthropic Messages API and every other api_key
# vendor). Wraps `reqwest::Response::bytes_stream()`.
eventsource-stream = "0.2"

# Official Rust MCP SDK (research.md §3), pinned per Constitution
# Principle IV. `client` + `transport-child-process` are the only
# features holzi needs — it is an MCP *client* spawning stdio servers,
# never a server itself. `cli_delegate`'s Claude Code permission-prompt-tool
# bridge (`adapters/cli_delegate/permission_mcp_server.rs`) speaks a
# minimal hand-rolled stdio JSON-RPC loop instead of depending on rmcp's
# `server`/`transport-io` features for one tool — considered and
# rejected as unnecessary weight for that single-tool surface.
rmcp = { version = "=3.4.0", default-features = false, features = ["client", "transport-child-process"] }

# Per-invocation disposable CLAUDE_CONFIG_DIR/CODEX_HOME + cwd (spec
# 007-cli-delegate FR-003) — was dev-dependency-only (tests used it for
# fixtures); cli_delegate's production code needs it too.
tempfile = "3"

# `claude setup-token` is a raw-ANSI Ink TUI, not a line-oriented CLI — piped,
# non-PTY stdio produces zero output (research.md §5, live-verified). Only
# cli_delegate's connect flow (US2) needs a real PTY; the chat-invocation path
# (claude -p) uses plain piped stdio as before. Cross-platform (wezterm's
# crate — Unix PTYs + Windows ConPTY).
portable-pty = "0.9"
# portable-pty's own error type (`spawn_command`/`openpty`/...) — already a
# transitive dependency, added directly so connect_claude.rs can downcast a
# spawn failure to the underlying `std::io::Error` (ENOENT detection,
# mirroring `process.rs::map_spawn_error`'s plain-`tokio::process` version).
anyhow = "1"

# Cross-platform microphone capture for voice control (spec 008), gated by
# the `voice` feature. Pure Rust, no separate cross-compile path for mobile.
cpal = { version = "0.18.2", optional = true }
# Local Whisper STT (spec 008), gated by `llm-cpu` (see its feature comment
# above) — `candle`/`candle-nn` pinned to 0.10.2 to match the version
# mistralrs 0.8.1 already resolves to, so only one candle version tree
# exists. `candle-core` is renamed to `candle` (matching candle's own
# examples) since that is the crate's own `use candle::...` import path.
# candle 0.11.0 exists upstream but mistralrs 0.8.1 (still latest) requires
# candle-core/candle-nn `^0.10.2`; bumping here alone would compile two
# candle version trees instead of one. Revisit once mistralrs releases
# against candle 0.11.
candle = { version = "0.10.2", package = "candle-core", optional = true }
candle-nn = { version = "0.10.2", optional = true }
candle-transformers = { version = "0.11.0", optional = true }
# Whisper's tokenizer (tokenizer.json, GPT-2-style BPE). `fancy-regex` matches
# the pure-Rust regex engine candle's own whisper example uses instead of the
# C-backed `onig` feature.
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"], optional = true }

[target.'cfg(unix)'.dependencies]
# Kills a whole process group (`kill(-pgid, SIGKILL)`) so a killed
# `sh -c "..."` cannot leave behind a grandchild it forked — `Child::kill`
# only ever signals the one PID it holds (chat/tools/cli.rs, T032).
libc = "0.2"

[dev-dependencies]
# `tempfile` moved to `[dependencies]` above — tests already get it
# transitively, no separate dev-dependency entry needed.
# Additive to the `[dependencies]` rmcp entry: test-only `server` support
# (feature-unified into one build across dependencies + dev-dependencies)
# lets `chat/tools/mcp_tests.rs` run a real, minimal `ServerHandler` over
# an in-memory `tokio::io::duplex` pair — no child process needed to
# exercise the real client-side tools/list + tools/call round trip.
# `cli_delegate`'s own MCP server (permission_mcp_server.rs) does not use
# this — it's a minimal hand-rolled stdio loop, not an rmcp `ServerHandler`
# (Cargo.toml `[dependencies]` comment above).
rmcp = { version = "=3.4.0", default-features = false, features = ["server"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "test-util"] }
futures = "0.3"
# HTTP mock server for adapter tests — spins a local listener on a
# random port, allows scripted responses, and shuts down on Drop.
wiremock = "0.6"
