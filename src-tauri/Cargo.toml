[package]
name = "holzi"
version = "0.1.0"
description = "Portable personal-agent Tauri app with embedded encrypted store"
authors = ["haexmas"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/haexmas/holzi"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "holzi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.3.0", features = [] }

[dependencies]
tauri = { version = "2.6.2", features = [] }
tauri-plugin-log = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
log = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
ts-rs = { version = "10", features = ["serde-compat", "uuid-impl"] }
filetime = "0.2"

# haex-crdt 0.4.0 pinned per plans/001-desktop-mvp.md.
# `raw-connection` gives holzi's storage wrapper direct rusqlite access for
# the `haex_hlc_no_sync = current_hlc()` write convention (Etappe 0 finding).
haex-crdt = { git = "https://github.com/haexmas/haex-crdt", rev = "1c069ef0ea19143af2748f40fc41cba05c94dbe1", features = ["raw-connection"] }

[dev-dependencies]
tempfile = "3"
