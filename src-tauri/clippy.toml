# Spec 024, research R19: the vault is read and written through
# `vault_gate::VaultDb` (`Database::read` / `Database::write`), so haex-crdt's
# transformer stamps every write with the transaction HLC. The raw connection
# is only for statements that cannot run in a CRDT transaction, each with a
# justified `#[allow(clippy::disallowed_methods)]`.
disallowed-methods = [
    { path = "haex_crdt::Database::with_connection", reason = "read and write through vault_gate::VaultDb (research R19)" },
]
